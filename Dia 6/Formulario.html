<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-lg border-0">
                    <div class="card-body p-4">
                        <h1 class="text-center mb-4 text-primary">Formulario de Registro</h1>
                        
                        <div id="successMessage" class="alert alert-success d-none" role="alert">
                            ¡Formulario enviado exitosamente!
                        </div>
                        
                        <form id="registrationForm" novalidate>
                            <div class="mb-3">
                                <label for="name" class="form-label fw-semibold">
                                    Nombre<span class="text-danger">*</span>
                                </label>
                                <input type="text" class="form-control" id="name" name="name" maxlength="40" required>
                                <div class="invalid-feedback d-none" id="nameError">
                                    Solo se permiten caracteres alfabéticos
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="lastName" class="form-label fw-semibold">
                                    Apellido<span class="text-danger">*</span>
                                </label>
                                <input type="text" class="form-control" id="lastName" name="lastName" maxlength="40" required>
                                <div class="invalid-feedback d-none" id="lastNameError">
                                    Solo se permiten caracteres alfabéticos
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="telephone" class="form-label fw-semibold">Teléfono</label>
                                <input type="tel" class="form-control" id="telephone" name="telephone">
                                <div class="invalid-feedback d-none" id="telephoneError">
                                    Solo se permiten números
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="birthday" class="form-label fw-semibold">Fecha de Nacimiento</label>
                                <input type="date" class="form-control" id="birthday" name="birthday">
                                <div class="invalid-feedback d-none" id="birthdayError">
                                    Ingrese una fecha válida
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">
                                    Email<span class="text-danger">*</span>
                                </label>
                                <input type="email" class="form-control" id="email" name="email" required>
                                <div class="invalid-feedback d-none" id="emailError">
                                    Ingrese un email válido
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="linkedin" class="form-label fw-semibold">URL de LinkedIn</label>
                                <input type="url" class="form-control" id="linkedin" name="linkedin" placeholder="https://www.linkedin.com/in/usuario">
                                <div class="invalid-feedback d-none" id="linkedinError">
                                    Ingrese una URL válida
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="gender" class="form-label fw-semibold">Género</label>
                                <select class="form-select" id="gender" name="gender">
                                    <option value="">Seleccione una opción</option>
                                    <option value="male">Masculino</option>
                                    <option value="female">Femenino</option>
                                </select>
                            </div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <button type="button" class="btn btn-secondary" id="cancelBtn">Cancelar</button>
                                <button type="submit" class="btn btn-primary">Enviar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
