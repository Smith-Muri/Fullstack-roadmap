<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks</title>
    <style> 

       .current-task {
            color: green;
            font-weight: bold;
        }

        .completada {
            color: rgb(200, 0, 0);
            text-decoration: line-through;
        }

        .close {
            cursor: pointer;
            color: red;
        }
    </style>
</head>
<body>
    <h1>Tasks</h1>
    <div id="myTask" class="header">
    <ol>
        <li>wake up</li>
    </ol>
    <input type="text" id="myInpunt" placeholder="New Task">
    <button onclick="newElemnt()" class="addBtn">Add Task</button>
    </div>

    <script>
       let myList = document.getElementsByTagName("LI");
       let i;
       for (i = 0; i < myList.length; i++) {
        let span = document.createElement("SPAN");
        let txt = document.createTextNode("\u00D7");
        span.className = "close";
        span.appendChild(txt);
        myList[i].appendChild(span);
       }


       let close = document.getElementsByClassName("close");
       let x;
         for (x = 0; x < close.length; x++) {
          close[x].onclick = function() {
                let div = this.parentElement;
                div.style.display = "none";
          }
         }

         let list = document.querySelector('ol');
         list.addEventListener('click', function(ev) {
            if (ev.target.tagName === 'LI') {
                ev.target.classList.toggle('checked');
            }
         }, false);


         function newElemnt() {
            let li = document.createElement("li");
            let inputValue = document.getElementById("myInpunt").value;
            let t = document.createTextNode(inputValue);
            li.appendChild(t);

            if (inputValue === '') {
                alert("ESCRIBE ALGO TONTO");
            } else {
                document.querySelector("ol").appendChild(li);
            }


            const currentTask = document.querySelector('.current-task');
            if (currentTask) {
                currentTask.classList.remove('current-task');
                currentTask.classList.add('completada');
            }
                
            
            
            li.classList.add('current-task');
            document.querySelector("ol").appendChild(li);
            document.getElementById("myInpunt").value = "";

            document.getElementById("myInpunt").value = "";

            let span = document.createElement("SPAN");
            let txt = document.createTextNode("\u00D7");
            span.className = "close";
            span.appendChild(txt);
            li.appendChild(span);

            for (i = 0; i < close.length; i++) {
                close[i].onclick = function() {
                    let div = this.parentElement;
                    div.style.display = "none";
                }
            }

         }
    </script>
</body>
</html>
